name: Typecheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tsc:
    name: Run tsc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
